# git-cliff — génération du CHANGELOG.md à partir des Conventional Commits.
# Docs : https://git-cliff.org/docs/configuration

[changelog]
# En-tête du fichier
header = """
# Changelog

Toutes les évolutions notables de la plateforme UXCO Booking sont documentées ici.\n
Format basé sur [Keep a Changelog](https://keepachangelog.com/) et
[Conventional Commits](https://www.conventionalcommits.org/).\n
"""
# Corps : une section par version, groupée par type de commit
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Non publié]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**({{ commit.scope }})** {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""
# Après rendu : transforme (TW-123) en lien cliquable Freshservice.
# NB : on le fait en post-traitement (et non en commit_preprocessor) pour ne pas
# injecter de parenthèses/URL dans le scope avant le parsing conventionnel, ce qui
# ferait échouer le parse de `feat(TW-123): ...` et exclurait le commit du changelog.
postprocessors = [
  { pattern = '\(TW-(\d+)\)', replace = "([TW-${1}](https://uxcomanagement.freshservice.com/a/project_management/ws/TW/tasks/TW-${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = true   # on ignore les commits hors convention dans le changelog
split_commits = false
protect_breaking_commits = true

# Pas de nettoyage avant parsing : le lien Freshservice est posé en postprocessor
# (cf. [changelog].postprocessors) pour ne pas casser le parsing conventionnel.
commit_preprocessors = []

# Mapping type de commit -> section du changelog. L'ordre fixe l'ordre d'affichage.
commit_parsers = [
  { message = "^feat", group = "🚀 Nouveautés" },
  { message = "^fix", group = "🐛 Corrections" },
  { message = "^perf", group = "⚡ Performances" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^docs", group = "📚 Documentation" },
  { message = "^test", group = "🧪 Tests" },
  { message = "^build", group = "📦 Build & dépendances" },
  { message = "^ci", group = "⚙️ CI/CD" },
  { message = "^monitor", group = "📈 Monitoring" },
  { message = "^chat", group = "🤖 Chatbot" },
  { message = "^style", skip = true },
  { message = "^chore", skip = true },
  { message = "^revert", group = "⏪ Reverts" },
  { message = ".*", skip = true },
]

# Tags de version : v1.2.3
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
